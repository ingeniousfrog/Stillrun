[package]
name = "stillrun"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "A command lifecycle runtime for macOS terminal jobs."
license = "MIT"
homepage = "https://github.com/ingeniousfrog/Stillrun"
repository = "https://github.com/ingeniousfrog/Stillrun"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
encoding_rs = "0.8"
libc = "0.2"
notify = "6.1"
regex = "1.13"
rusqlite = { version = "0.32", features = ["bundled", "modern_sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-width = "0.2"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.12"
