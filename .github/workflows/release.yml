name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"

      - name: Test
        run: cargo test --locked

      - name: Package release archive
        run: ./packaging/release-archive.sh "${{ matrix.target }}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: stillrun-${{ matrix.target }}
          path: |
            dist/stillrun-${{ matrix.target }}.tar.gz
            dist/stillrun-${{ matrix.target }}.tar.gz.sha256

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          title="Stillrun ${TAG_NAME}"
          notes="Prebuilt Stillrun CLI archives for macOS Apple Silicon and Intel."
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" dist/* --clobber
          else
            gh release create "${TAG_NAME}" dist/* --title "${title}" --notes "${notes}"
          fi
